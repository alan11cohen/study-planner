[project]
name = "ai-study-planner-backend"
version = "0.1.0"
description = "AI Study Planner backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.7.0",
    "bcrypt==4.2.0",
    "PyJWT==2.9.0",
    "openai>=2.38.0",
    "llama-index-core>=0.14.22",
    "llama-index-vector-stores-postgres>=0.8.1",
    "llama-index-embeddings-openai>=0.6.0",
    "pypdf>=6.12.2",
    "python-multipart>=0.0.30",
    "langgraph>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]
